name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write

env:
  NODE_VERSION: '20'
  JAVA_VERSION: '17'
  GRADLE_VERSION: '8.11.1'

jobs:
  # Build and test web application
  build-web:
    name: Build Web App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint || true

      - name: Build web application
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: |
            .next/
            public/
          retention-days: 7

  # Build Android APK/AAB
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest
    needs: build-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r27b
          build-tools-version: '34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract signing keystore
        id: extract-keystore
        run: |
          # The keystore should be provided as a base64-encoded secret
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
          echo "keystore_path=signing.keystore" >> $GITHUB_OUTPUT

      - name: Create keystore properties
        run: |
          cat > keystore.properties <<EOF
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=signing.keystore
          EOF

      - name: Build Android project
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Verify APK signature
        run: |
          apksigner verify --print-certs android/app/build/outputs/apk/release/*.apk

      - name: Generate checksums
        run: |
          cd android/app/build/outputs/apk/release/
          sha256sum *.apk > checksums.txt
          cd ../../../../../
          cd android/app/build/outputs/bundle/release/
          sha256sum *.aab >> ../../../../checksums.txt
          cd ../../../../../
          cat checksums.txt

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            checksums.txt
          retention-days: 30

      - name: Extract version info
        id: version-info
        run: |
          # Extract version from tag or input
          if [[ "${{ github.event_name }}" == "push" ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

  # Generate release notes
  generate-release-notes:
    name: Generate Release Notes
    runs-on: ubuntu-latest
    needs: [build-web, build-android]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          CURRENT_TAG=${{ needs.build-android.outputs.version }}

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" $PREV_TAG..$CURRENT_TAG)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" -20)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release notes
        run: |
          VERSION=${{ needs.build-android.outputs.version }}
          cat > RELEASE_NOTES_${VERSION}.md <<EOF
          # Phryvos ${VERSION}

          **Release Date:** $(date -u +"%Y-%m-%d")

          ## Changes
          ${{ steps.changelog.outputs.changelog }}

          ## Downloads
          - **Android APK:** \`Phryvos-${VERSION}.apk\`
          - **Android App Bundle:** \`Phryvos-${VERSION}.aab\`
          - **Web App:** Available at https://phryvos.in

          ## Verification
          - SHA-256 checksums provided in \`checksums.txt\`
          - APK signed with release keystore
          - Digital Asset Links verified at https://phryvos.in/.well-known/assetlinks.json

          ## Installation
          ### Android (APK)
          1. Download \`Phryvos-${VERSION}.apk\`
          2. Enable "Install unknown apps" for your browser/file manager
          3. Open the APK to install

          ### Android (Play Store)
          Coming soon - will be available on Google Play Store.

          ### PWA (Web)
          1. Visit https://phryvos.in in Chrome/Edge
          2. Click "Install" in address bar or menu
          3. Works offline after first visit

          ---
          **Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION}
          EOF

          cat RELEASE_NOTES_${VERSION}.md

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES_*.md
          retention-days: 30

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-web, build-android, generate-release-notes]
    steps:
      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: android-artifacts

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-notes

      - name: Prepare release files
        run: |
          VERSION=${{ needs.build-android.outputs.version }}
          mkdir -p release-files

          # Rename APK/AAB with version
          cp android-artifacts/app/build/outputs/apk/release/*.apk release-files/Phryvos-${VERSION}.apk
          cp android-artifacts/app/build/outputs/bundle/release/*.aab release-files/Phryvos-${VERSION}.aab
          cp android-artifacts/checksums.txt release-files/checksums.txt
          cp release-notes/RELEASE_NOTES_${VERSION}.md release-files/RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-android.outputs.tag }}
          name: Phryvos ${{ needs.build-android.outputs.version }}
          body_path: release-files/RELEASE_NOTES.md
          files: |
            release-files/Phryvos-${{ needs.build-android.outputs.version }}.apk
            release-files/Phryvos-${{ needs.build-android.outputs.version }}.aab
            release-files/checksums.txt
          draft: false
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: false

  # Update assetlinks.json if needed
  update-assetlinks:
    name: Update Asset Links
    runs-on: ubuntu-latest
    needs: build-android
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract certificate fingerprint from keystore
        id: fingerprint
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
          FINGERPRINT=$(keytool -list -v -keystore signing.keystore -storepass ${{ secrets.ANDROID_KEYSTORE_PASSWORD }} -alias ${{ secrets.ANDROID_KEY_ALIAS }} | grep "SHA256:" | head -1 | sed 's/.*SHA256: //')
          echo "fingerprint=$FINGERPRINT" >> $GITHUB_OUTPUT
          echo "Extracted fingerprint: $FINGERPRINT"

      - name: Update assetlinks.json
        run: |
          FINGERPRINT=${{ steps.fingerprint.outputs.fingerprint }}
          cat > public/.well-known/assetlinks.json <<EOF
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "in.phryvos.app",
              "sha256_cert_fingerprints": ["$FINGERPRINT"]
            }
          }]
          EOF
          cat public/.well-known/assetlinks.json

      - name: Commit assetlinks.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet public/.well-known/assetlinks.json; then
            echo "assetlinks.json unchanged"
          else
            git add public/.well-known/assetlinks.json
            git commit -m "chore: update assetlinks.json for ${{ needs.build-android.outputs.version }}"
            git push
          fi

  # Deploy web to production (optional)
  deploy-web:
    name: Deploy Web
    runs-on: ubuntu-latest
    needs: [build-web, create-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download web build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Deploy to production
        run: |
          # Add your deployment commands here
          # Examples:
          # - Vercel: npx vercel deploy --prod --token=$VERCEL_TOKEN
          # - Cloudflare Pages: npx wrangler pages deploy web-build --project-name=phryvos
          # - Docker: docker build -t phryvos:latest . && docker push ...
          echo "Web deployment placeholder - configure your deployment target"
          echo "Build available at web-build/"

  # Notify on completion
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [create-release, update-assetlinks, deploy-web]
    if: always()
    steps:
      - name: Send notification
        run: |
          STATUS=${{ needs.create-release.result }}
          VERSION=${{ needs.build-android.outputs.version }}

          if [ "$STATUS" == "success" ]; then
            echo "✅ Release $VERSION published successfully!"
            echo "📱 APK: https://github.com/${{ github.repository }}/releases/tag/$VERSION"
            echo "🌐 Web: https://phryvos.in"
            echo "🔗 Asset Links: https://phryvos.in/.well-known/assetlinks.json"
          else
            echo "❌ Release $VERSION failed!"
            exit 1
          fi